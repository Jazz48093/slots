<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notice - UC 104 Dashboard</title>
  <meta name="description" content="This dashboard link has been moved. Please contact your MED for the updated link.">
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Luminous Background Orbs -->
  <div class="ambient-orb orb-1" aria-hidden="true"></div>
  <div class="ambient-orb orb-2" aria-hidden="true"></div>
  <div class="ambient-orb orb-3" aria-hidden="true"></div>

  <div class="notice-wrapper">
    <div class="glass-panel-elevated notice-card">
      <div class="notice-icon-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>

      <span class="notice-pill">Link Updated</span>

      <h1 class="notice-title">Dashboard Link Moved</h1>

      <div class="notice-message">
        Contact your MED for the new link.
      </div>

      <p class="notice-desc">
        This link has been discarded and is no longer active. Please contact your MED representative to get access to the updated dashboard link.
      </p>
    </div>
  </div>
</body>
</html>
